# 离散数学（左孝凌）· 课程大纲 · 修订 rev1（学生要求直接从「对偶与范式」开讲）
# 依据：左孝凌《离散数学》1982（学生纸书，逐节目录见 sources/zuoxiaoling-discrete-math-toc.md）；
#       老师课件 reference/01-左孝凌课件1.md（174 页，第一章 1.1–1.8）、reference/02-左孝凌课件2.md（84 页，第二章 2.1–2.7）。
# 主干：第 1～7 章；第五篇（第八、九章）与 5-6（置换群与伯恩赛德）标为「选学：待考纲确认」。
# 贯穿项目：关系与图算法工具包（Python 3.13，标准库优先），拆成实验一～实验五。
# rev1 变更：课堂已讲完 1.1–1.8 与 2.1–2.7，学生自评"学过但不成体系"，明确要求从 1-7 切入，
#   故删去绪论、四张前置唤醒卡与命题逻辑前四节共 9 个节点及指向它们的边；其余节点与顺序不变，
#   logic-normal-form（对偶与范式）成为第 1 课并承担开场。

nodes:
  - id: logic-normal-form
    title: '对偶与范式'
    kind: 实操
    objective: '把公式化成主析取范式，并读出它的成真赋值'
    problem: '期末卷上，逻辑一章的大题几乎年年落在“求主析取范式”“把这个式子化成最简形式”这类动作上，分值比选择填空加起来还重——这是整门课的第一课，就从这一格分数讲起。给定一个公式，怎么一眼看出它在哪些赋值下为真？主析取范式就是这张清单，也是判等值、判蕴含、做归结的通用手段。而 24 条常用等值式不必背：对偶式与范式都能从真值表现推，公式忘了就在纸上长出来。'
    practice: '讲练并重。真值表法与小项法各做一题，对比哪种更快，并写出原式的对偶式。'
    prerequisites: []
    concepts: ['对偶式', '合取范式与析取范式', '主析取范式']
    resources:
      - title: '左孝凌《离散数学》1-6 其他联结词、1-7 对偶与范式'
        type: book
      - title: '老师课件 1 · 1.6–1.7（第 83–146 页）'
        type: article
        url: 'reference/01-左孝凌课件1.md'
    pitfalls: ['小项编号与变元顺序写反', '漏掉不含某变元的项', '把极大项当极小项用']
    status: 未开始
    mastery: 0

  - id: logic-inference
    title: '推理理论：证明怎么写'
    kind: 实操
    objective: '用 P、T 规则写出三步以上的推理证明，格式不空转'
    problem: '证明题无从下手，多半是不知道第一句写什么。本课给可照抄的骨架：前提逐条编号写 P、结论拆成蕴含、目标放最后一行；直接证法、附加前提法、归谬法三条路线各一个模板。'
    practice: '讲练并重。三条路线各照模板抄一份完整证明，再独立写老师课件上的一题，重点看第一行与最后一行怎么衔接。'
    prerequisites: ['logic-normal-form']
    concepts: ['P 规则与 T 规则', '直接证法', '附加前提法', '归谬法']
    resources:
      - title: '左孝凌《离散数学》1-8 推理理论'
        type: book
      - title: '老师课件 1 · 1.8（第 147–174 页）'
        type: article
        url: 'reference/01-左孝凌课件1.md'
      - title: 'Book of Proof 第 4–6 章（直接证明、逆否证明、反证）'
        type: book
        url: 'https://richardhammack.github.io/BookOfProof/'
    pitfalls: ['把结论当前提用', '附加前提证完没有还原成蕴含', '写 T 规则不标依据', '归谬的假设写错']
    realworld: '判断一段论证站不站得住、程序断言的条件推导'
    status: 未开始
    mastery: 0

  - id: lab-1-truth-engine
    title: '实验一：把推理判成有效'
    kind: 实验
    objective: '写真值表引擎，对教材例题判定推理是否有效并打印依据'
    problem: '手算只判过一题，老师课件上却有几十道。本课用标准库写一个小引擎，把整批推理一次验完，同时反查自己手算错在哪一题。'
    practice: '以练为主（验收为主）。先跑通再对账：引擎给出的有效性与手算结果逐题对照，对不上的那题就是理解漏洞。'
    prerequisites: ['logic-normal-form', 'logic-inference']
    concepts: ['穷举赋值', '前提合取蕴含结论', '标准库 itertools']
    resources:
      - title: '左孝凌《离散数学》1-8 例题（当标准答案）'
        type: book
      - title: 'Python 3.13 标准库 itertools 官方文档'
        type: official-doc
        url: 'https://docs.python.org/3.13/library/itertools.html'
    pitfalls: ['只判结论不管前提是否同真', '把“无效”误读成“结论为假”']
    status: 未开始
    mastery: 0

  - id: pred-predicate
    title: '谓词、命题函数与量词'
    kind: 概念
    objective: '区分个体、谓词与量词，写出量词命题的真值条件'
    problem: '命题逻辑拆不开“张三及格”与“李四及格”的共同结构。谓词逻辑把主语与谓语分开，才有“所有”与“存在”；本课讲清量词如何改变真值条件。'
    practice: '以讲为主。老师课件里的 n 元谓词例子照原话讲，量词只讲全称与存在两个。'
    prerequisites: ['logic-inference']
    concepts: ['个体与谓词', '命题函数', '全称量词与存在量词']
    resources:
      - title: '左孝凌《离散数学》2-1 谓词的概念与表示、2-2 命题函数与量词'
        type: book
      - title: '老师课件 2 · 2.1–2.2（第 3–30 页）'
        type: article
        url: 'reference/02-左孝凌课件2.md'
    pitfalls: ['把命题函数当命题', '忽略论域']
    status: 未开始
    mastery: 0

  - id: pred-translation
    title: '谓词公式翻译与换名'
    kind: 实操
    objective: '把含“所有”“有的”的中文译成公式，并正确换名与代入'
    problem: '“所有学生都用功，有的学生不用功”两句里的“学生”不是一回事：一个在辖域内，一个在辖域外。换名与代入规则决定符号化结果是否唯一。'
    practice: '讲练并重。教材 P63(5) 一类的翻译题逐句过，换名与代入各纠一个典型错。'
    prerequisites: ['pred-predicate']
    concepts: ['辖域', '约束变元与自由变元', '换名规则']
    resources:
      - title: '左孝凌《离散数学》2-3 谓词公式与翻译、2-4 变元的约束'
        type: book
      - title: '老师课件 2 · 2.3–2.4（第 31–48 页）'
        type: article
        url: 'reference/02-左孝凌课件2.md'
    pitfalls: ['量词辖域画错', '换名时改动了自由变元', '存在量词后面接合取']
    status: 未开始
    mastery: 0

  - id: pred-equivalence
    title: '谓词等价式与前束范式'
    kind: 实操
    objective: '用量词否定律改写公式，并三步求出前束范式'
    problem: '“不是所有人都及格”等于“有人不及格”。这两条量词否定律是考试必考，也是 2-7 四条推理规则的前提。'
    practice: '讲练并重。先把两条否定律写死，再按“去箭头—移否定—提量词”三步求前束范式。'
    prerequisites: ['pred-translation']
    concepts: ['量词否定律', '量词辖域扩张', '前束范式']
    resources:
      - title: '左孝凌《离散数学》2-5 谓词演算的等价式与蕴含式、2-6 前束范式'
        type: book
      - title: '老师课件 2 · 2.5–2.6（第 49–70 页）'
        type: article
        url: 'reference/02-左孝凌课件2.md'
    pitfalls: ['提辖域时换了变元名', '否定号没有推到底']
    status: 未开始
    mastery: 0

  - id: pred-inference
    title: '谓词推理：四条规则'
    kind: 实操
    objective: '用 US、UG、ES、EG 写推理证明，每步标注依据'
    problem: '苏格拉底三段论在谓词逻辑里落成五行证明：四条规则各管一次量词进出，进出的顺序错了整个证明就废。本课按老师课件 2.7 的例题结构讲。'
    practice: '讲练并重。照例题结构抄一遍，再独立写教材 P79 一题，重点看量词进出的顺序。'
    prerequisites: ['pred-equivalence', 'pred-translation']
    concepts: ['全称示例', '全称推广', '存在示例', '存在推广']
    resources:
      - title: '左孝凌《离散数学》2-7 谓词演算的推理理论'
        type: book
      - title: '老师课件 2 · 2.7（第 71–84 页）'
        type: article
        url: 'reference/02-左孝凌课件2.md'
    pitfalls: ['存在示例对同一个体用了两次', '全称推广用在附加前提引入的变元上', '存在量词消去后没有换新名']
    status: 未开始
    mastery: 0

  - id: set-operations
    title: '集合的运算与恒等式'
    kind: 概念
    objective: '用元素法或恒等式证明两个集合相等'
    problem: '证明 $A-(B\cup C)=(A-B)\cap(A-C)$ 第一句写什么？集合题的证明格式与逻辑题惊人一致：任取元素，推到另一侧。价值在讲清这套模板。'
    practice: '以讲为主。德摩根律与分配律各举一例，元素法模板当场写一遍。'
    prerequisites: ['pred-inference']
    concepts: ['集合运算', '德摩根律', '元素法证相等']
    resources:
      - title: '左孝凌《离散数学》3-1 集合的概念和表示法、3-2 集合的运算'
        type: book
      - title: 'Book of Proof 8.1–8.3（证集合相等、子集）'
        type: book
        url: 'https://richardhammack.github.io/BookOfProof/'
    pitfalls: ['证相等只证了一个方向', '把包含写成相等']
    status: 未开始
    mastery: 0

  - id: set-inclusion-exclusion
    title: '包含排斥原理'
    kind: 实操
    objective: '用容斥公式算三个集合的并集基数，并解释每一项'
    problem: '一个班 40 人，会 C 的 25 人、会 Python 的 20 人、都会的 10 人，两样都不会的有几个？容斥公式画成文氏图，就是加减重叠部分。'
    practice: '讲练并重。从两集合递进到三集合，每步要求先画文氏图再代公式。'
    prerequisites: ['set-operations']
    concepts: ['容斥公式', '文氏图', '鸽巢原理']
    resources:
      - title: '左孝凌《离散数学》3-3 包含排斥原理'
        type: book
      - title: 'Rosen《离散数学及其应用》第 8 版 计数章（容斥与鸽巢）'
        type: book
        url: 'https://www.aijiaocai.com/textbook/details?textbook_id=715745'
    pitfalls: ['三集合公式漏加三项交', '把“至少会一样”当成“都会”']
    status: 未开始
    mastery: 0

  - id: rel-cartesian
    title: '序偶、笛卡尔积与关系'
    kind: 概念
    objective: '把二元关系写成集合式、关系矩阵与关系图三种形式'
    problem: '“同班”“大于”“认识”都用什么表示？集合式便于证明，矩阵便于计算，图便于看结构——本课把同一个关系换三种写法，为 3-8 的闭包打底。'
    practice: '以讲为主。同一题换三种表示各写一遍，并说明哪种表示最适合判哪个性质。'
    prerequisites: ['set-operations']
    concepts: ['有序对', '笛卡尔积', '关系矩阵与关系图']
    resources:
      - title: '左孝凌《离散数学》3-4 序偶与笛卡尔积、3-5 关系及其表示'
        type: book
    pitfalls: ['把 $A\times B$ 与 $B\times A$ 混为一谈', '关系矩阵的行列对应写反']
    status: 未开始
    mastery: 0

  - id: rel-properties
    title: '关系的五个性质'
    kind: 实操
    objective: '逐条判定自反、反自反、对称、反对称、传递'
    problem: '给一个关系矩阵，怎么一眼看出它传不传递？五个性质都有矩阵判据，考试就考这个判定过程——价值在练熟动作。'
    practice: '讲练并重。五个性质先在集合式上判一遍，再用矩阵判一遍，两法互相对答案。'
    prerequisites: ['rel-cartesian']
    concepts: ['自反与反自反', '对称与反对称', '传递性', '矩阵判据']
    resources:
      - title: '左孝凌《离散数学》3-6 关系的性质'
        type: book
      - title: '屈婉玲《离散数学（第3版）》第 2 章 二元关系'
        type: book
        url: 'https://xuanshu.hep.com.cn/front/book/findBookDetails?bookId=658daaba74ce561611bd9a4f'
    pitfalls: ['把反对称当不对称', '传递性只验了相邻元素', '自反与反自反都可为假却当成互补']
    status: 未开始
    mastery: 0

  - id: rel-composition
    title: '复合关系与逆关系'
    kind: 概念
    objective: '算 $R\circ S$ 与 $R^{-1}$，并说出与矩阵乘法的对应'
    problem: '关系复合就是布尔矩阵乘法——这不是巧合，而是第七章可达性计算的伏笔。同一件事用两种语言写一遍，后面省一半力气。'
    practice: '以讲为主。一题用集合式算、一题用矩阵乘法算，结果对上。'
    prerequisites: ['rel-properties']
    concepts: ['复合关系', '逆关系', '布尔矩阵乘法']
    resources:
      - title: '左孝凌《离散数学》3-7 复合关系和逆关系'
        type: book
    pitfalls: ['复合顺序写反']
    status: 未开始
    mastery: 0

  - id: rel-closure
    title: '关系的闭包运算'
    kind: 实操
    objective: '手算自反、对称、传递闭包，并用 Warshall 复核'
    problem: '从一个关系出发，最少补几条边它就传递了？这就是传递闭包，也是贯穿项目第一个算法的落点，教材 3-8 的例题正好当标准答案。'
    practice: '讲练并重。$R^+$ 与 $R^*$ 各手算一题，矩阵幂与 Warshall 两种算法比一遍。'
    prerequisites: ['rel-composition', 'rel-properties']
    concepts: ['自反闭包', '对称闭包', '传递闭包', 'Warshall 算法']
    resources:
      - title: '左孝凌《离散数学》3-8 关系的闭包运算'
        type: book
      - title: 'Rosen《离散数学及其应用》第 8 版 5.4 关系的闭包（沃舍尔算法）'
        type: book
        url: 'https://www.aijiaocai.com/textbook/details?textbook_id=715745'
      - title: 'NetworkX 算法索引（transitive_closure，作可选对照答案）'
        type: official-doc
        url: 'https://networkx.org/documentation/stable/reference/algorithms/index.html'
    pitfalls: ['$R^+$ 与 $R^*$ 记混', '求闭包后忘记补对角线', '对称闭包补的新边又引发传递']
    realworld: '依赖关系能否传递到达、组织里的间接汇报链'
    status: 未开始
    mastery: 0

  - id: lab-2-closure
    title: '实验二：关系性质与闭包'
    kind: 实验
    objective: '用邻接矩阵算五个性质与传递闭包，与教材习题逐格对上'
    problem: '教材 3-8 的例题你手算过一次；这一课让程序把同一题算一遍，对不上的那一格就是你对闭包的理解偏差。'
    practice: '以练为主（验收为主）。三行 Warshall 自己写，不许调库；结果与教材答案逐格对照。'
    prerequisites: ['rel-properties', 'rel-composition', 'rel-closure']
    concepts: ['邻接矩阵输入格式', '布尔矩阵运算', '对账表']
    resources:
      - title: '左孝凌《离散数学》3-6、3-8 例题与习题（当标准答案）'
        type: book
      - title: 'Python 3.13 标准库 graphlib 官方文档'
        type: official-doc
        url: 'https://docs.python.org/3.13/library/graphlib.html'
    pitfalls: ['拿库函数顶替手写 Warshall', '对账只比最终结论不看中间矩阵']
    status: 未开始
    mastery: 0

  - id: rel-partition
    title: '划分、覆盖与相容关系'
    kind: 概念
    objective: '判断集族是不是划分，并写出它诱导的等价关系'
    problem: '一个班按宿舍分、按学号尾数分、按性别分，哪些是合法划分？划分与等价关系是一体两面：3-9 讲判定，3-10 讲算法。'
    practice: '以讲为主。只讲划分的三条件与到等价关系的对应，相容关系点到为止。'
    prerequisites: ['rel-properties', 'set-operations']
    concepts: ['覆盖与划分', '划分的判定', '相容关系']
    resources:
      - title: '左孝凌《离散数学》3-9 集合的划分和覆盖、3-11 相容关系'
        type: book
    pitfalls: ['允许块与块相交', '漏掉空集不能成块这一条']
    status: 未开始
    mastery: 0

  - id: rel-equivalence
    title: '等价关系与等价类'
    kind: 实操
    objective: '求一个等价关系的全部等价类，并验证商集是划分'
    problem: '模 5 同余把整数切成五类——怎么把类列全且不重不漏？这是项目第二个算法的落点，教材 3-10 的例题给标准答案。'
    practice: '讲练并重。模 5 同余与教材例题各做一遍，用划分三条件自检。'
    prerequisites: ['rel-partition', 'rel-closure']
    concepts: ['等价关系', '等价类', '商集', '并查集']
    resources:
      - title: '左孝凌《离散数学》3-10 等价关系与等价类'
        type: book
      - title: 'NetworkX 算法索引（equivalence_classes，作可选对照答案）'
        type: official-doc
        url: 'https://networkx.org/documentation/stable/reference/algorithms/index.html'
    pitfalls: ['等价类漏写外层集合括号', '少列一个类', '把等价类当成代表元']
    status: 未开始
    mastery: 0

  - id: rel-order
    title: '序关系与哈斯图'
    kind: 实操
    objective: '画偏序的哈斯图，并求极大元、最大元与上下界'
    problem: '课程先修关系怎么排成一张图，让“先学哪门”一目了然？哈斯图去掉自环与传递边，剩下的层次就是拓扑序。'
    practice: '讲练并重。整除关系与集合包含关系各画一张哈斯图，再用 graphlib 验拓扑序。'
    prerequisites: ['rel-equivalence', 'rel-partition']
    concepts: ['偏序关系', '哈斯图', '极大元与最大元', '拓扑排序']
    resources:
      - title: '左孝凌《离散数学》3-12 序关系'
        type: book
