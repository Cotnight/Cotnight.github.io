    concepts: ['对偶图', '点着色', '色数', '四色问题']
    resources:
      - title: '左孝凌《离散数学》7-6 对偶图与着色'
        type: book
      - title: 'Rosen《离散数学及其应用》第 8 版 图着色'
        type: book
        url: 'https://www.aijiaocai.com/textbook/details?textbook_id=715745'
    pitfalls: ['对偶图的顶点数取错', '把贪心结果当最优色数']
    realworld: '考试安排、频段分配'
    status: 未开始
    mastery: 0

  - id: graph-tree
    title: '树的性质与判定'
    kind: 概念
    objective: '用连通、无回路、边数三条中任两条判定一棵树'
    problem: '六个顶点五条边且连通，一定是树吗？三条性质任取两条都够用——这是第七章最常考的判定。'
    practice: '以讲为主。三条等价条件互推一遍，再给边判树。'
    prerequisites: ['graph-path']
    concepts: ['树', '叶与分枝点', '等价判定条件']
    resources:
      - title: '左孝凌《离散数学》7-7 树与生成树（树的部分）'
        type: book
    pitfalls: ['只凭 n-1 条边单独判树', '忽略连通性']
    status: 未开始
    mastery: 0

  - id: graph-spanning-tree
    title: '最小生成树'
    kind: 实操
    objective: '用 Kruskal 与 Prim 手算同一图的最小生成树与权值和'
    problem: '宿舍楼之间铺网线怎么铺最省？同一条边两端的点各挑一次、不构成环，这就是 Kruskal——项目第四个落点，教材 7-7 的例题当答案。'
    practice: '讲练并重。两法各算一遍同一图，权值必须相同；再用并查集验环判定。'
    prerequisites: ['graph-tree', 'graph-matrix']
    concepts: ['生成树', '最小生成树', 'Kruskal 算法', 'Prim 算法']
    resources:
      - title: '左孝凌《离散数学》7-7 树与生成树（生成树部分）'
        type: book
      - title: 'Rosen《离散数学及其应用》第 8 版 7.5 最小生成树'
        type: book
        url: 'https://www.aijiaocai.com/textbook/details?textbook_id=715745'
    pitfalls: ['选边时不查环', 'Prim 换个起点得出不同的树就判错', '把权值和算成平均权']
    realworld: '校园网布线、电网规划'
    status: 未开始
    mastery: 0

  - id: lab-5-mst
    title: '实验五：布线方案与生成树'
    kind: 实验
    objective: '用并查集写 Kruskal，输出最小生成树的边集与总权值'
    problem: '把教材 7-7 的图和自己编的一张校园网布线图都跑一遍，交边集、总价与选边顺序。'
    practice: '以练为主（验收为主）。并查集三个函数手写；两个算法交叉验证权值，实验三的并查集直接复用。'
    prerequisites: ['graph-tree', 'graph-spanning-tree']
    concepts: ['并查集判环', '边集输出', '交叉验证']
    resources:
      - title: '左孝凌《离散数学》7-7 例题（当标准答案）'
        type: book
      - title: 'NetworkX 算法索引（tree.mst，作可选对照答案）'
        type: official-doc
        url: 'https://networkx.org/documentation/stable/reference/algorithms/index.html'
    pitfalls: ['并查集在加边后忘了合并集合', '把总权值算成平均', '自己编的权值表与输出对不上却不回头查输入']
    status: 未开始
    mastery: 0

  - id: graph-rooted-tree
    title: '根树与哈夫曼算法'
    kind: 实操
    objective: '用哈夫曼算法构造最优二叉树，并写出前缀码'
    problem: '一份报文里各字母出现频率不同，怎么编码让总长度最短？哈夫曼算法给的是可动手的最优解，也是第七章最后的计算题。'
    practice: '讲练并重。给定频率表用堆走一遍合并，最后核对前缀码无歧义。'
    prerequisites: ['graph-tree', 'graph-spanning-tree']
    concepts: ['根树', '二叉树', '哈夫曼算法', '前缀码']
    resources:
      - title: '左孝凌《离散数学》7-8 根树及其应用'
        type: book
      - title: 'Python 3.13 标准库 heapq 官方文档（取两个最小）'
        type: official-doc
        url: 'https://docs.python.org/3.13/library/heapq.html'
    pitfalls: ['合并顺序写错', '把带权路径长度算成平均码长']
    realworld: '文件压缩、变长编码'
    status: 未开始
    mastery: 0

  - id: opt-automata
    title: '选学：有限状态自动机'
    kind: 概念
    objective: '待考纲确认：若含第八章，能画状态图并判断串是否被接受'
    problem: '第五篇（第八章形式语言与自动机）是否在考纲内尚未确认（本校教学大纲没拿到）。本课备基础：状态转移图、串的接受与拒绝。'
    practice: '以讲为主。只做状态图与串判定；NFA 转 DFA、化简按考纲决定是否加。'
    prerequisites: ['graph-path', 'set-operations']
    concepts: ['文法与语言', '有限状态自动机', '串的接受']
    resources:
      - title: '左孝凌《离散数学》8-1 串和语言、8-3 有限状态自动机'
        type: book
    pitfalls: ['初态与终态混', '接受路径与转移函数混为一谈']
    status: 未开始
    mastery: 0

  - id: opt-error-code
    title: '选学：纠错码与海明码'
    kind: 概念
    objective: '待考纲确认：若含第九章，能算海明码校验位并纠一位错'
    problem: '第九章纠错码初步是否在考纲内尚未确认。本课最可能考的是海明码：校验位放在 2 的幂位，按综合征定位出错的那一位。'
    practice: '以讲为主。海明码编码与一位纠错各一题；线性分组码只讲生成矩阵的定义。'
    prerequisites: ['opt-automata']
    concepts: ['纠错的基本概念', '海明码', '综合征']
    resources:
      - title: '左孝凌《离散数学》9-1 通讯模型与纠错基本概念、9-3 海明码'
        type: book
    pitfalls: ['校验位位置取错', '综合征值与出错位号的对应反过来']
    status: 未开始
    mastery: 0

