date: "2026-10-19"
subject: discrete-math
items:
  - id: 1
    topic: "德摩根律：否定号进入括号时要换运算"
    question: "习题6 第3题要把 (¬p∨¬q)∨(p→¬q) 化成只含 ¬、∧ 的式子，末尾写成 ¬(p∨q)"
    misunderstanding: "把「非的或」与「或的否定」当成一回事。¬p∨¬q 应对应 ¬(p∧q)；写 ¬(p∨q) 相当于只给整体加否号、没有把 ∧ 与 ∨ 互换。（此题的正确终点就是 ¬(p∧q)，他离正确答案只差括号里的一个符号）"
    answer_summary: "¬(p∧q)=¬p∨¬q，¬(p∨q)=¬p∧¬q；否号进括号必换运算。"
    follow_up: "用只含 ¬ 与 ∧ 重做习题6 第3题的三个小题，每题写完用真值表抽查一组取值"
    importance: high
  - id: 2
    topic: "对偶式里与非／或非也要互换"
    question: "习题7 第1题 (p∧q)↑r 的对偶式写成 (p∨q)↑r"
    misunderstanding: "只记得「∧ 换 ∨」，忘了对偶原则同时要换 ↑↔↓（与非↔或非）与 0↔1。"
    answer_summary: "对偶＝∧↔∨、↑↔↓、0↔1，变量与括号不动；所以 (p∧q)↑r 的对偶是 (p∨q)↓r。"
    follow_up: "把习题7 第1题六小题里含 ↑ 或 ↓ 的两题重做"
    importance: medium
  - id: 3
    topic: "「假设前件真」之后的分类讨论"
    question: "习题7 第4题(2) p→q ⇒ p→(p∧q)：设 p→q 为真后直接假定 p 的取值，p=0 那一支写乱"
    misunderstanding: "p→q 为真并不给出 p 的值，它给出的是「p=0 或 q=1」这个二选一；分类时要把这个二选一当成分支依据，而不是先假定 p 是几。"
    answer_summary: "设 p→q 真 ⇒ 分两支：p=0（前件假，p→(p∧q) 整体真）；p=1（由 p→q 得 q=1，后件真）。两支都真，蕴含式成立。"
    follow_up: "用同一模板重做习题7 第4题的其余两小题"
    importance: medium
  - id: 4
    topic: "公式记不住 → 需要一张表而不是零散记忆"
    question: "「公式一直记不住」"
    misunderstanding: "把等值式与蕴含式当成 24 条独立公式去背；实际只需记主干恒等式与几条基本蕴含式，其余由对偶、反演与代入生成。"
    answer_summary: "先记主干，再练「由主干推出来」——推导一次比背十遍牢。"
    importance: medium
  - id: 5
    topic: "范式的两条求法（教材页上的「推演步骤」）"
    question: "问范式怎么算、有没有固定步骤"
    misunderstanding: "无（他会算）；需要的是把已在用的步骤固化成动作并加自检，避免考试时漏项"
    answer_summary: "先用真值表定索引（Σm 取真的行、ΠM 取假的行），再补缺变元写成小项/大项；互补自查：Σm 与 ΠM 合起来恰好 2^n 个。"
    importance: low
notes:
  - "2026-10-19 更正：主教练起初把 (p→q)∧(q→r) 的范式判为学生算错，经复算学生是对的——Σm(0,1,3,7)、ΠM(2,4,5,6)。原第 2 条「范式索引错」已删除，不再按错答案判他。"
