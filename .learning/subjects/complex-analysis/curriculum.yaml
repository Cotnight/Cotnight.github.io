  - id: ch3-residue
    title: "留数与留数定理"
    kind: 实操
    objective: "能算出各类极点的留数并用留数定理求闭路积分。"
    problem: "两份公开试卷都有 10 分大题：求函数在有限复平面内的奇点与相应留数，或用留数定理算一整圈积分。围道里塞了几个奇点，柯西公式要一个个拆开算，留数定理一次性加成 2πi 乘留数之和。"
    practice: "以练为主：先讲清留数就是洛朗展开里 c₋₁ 这一项，再给出一阶极点、m 阶极点与本性奇点三种算法，按「定奇点与阶 → 选规则 → 算留数 → 求和乘 2πi」反复练到熟练；配套「复变计算工具」手写留数函数，用数值围道积分做断言对照。"
    concepts:
      - "留数的定义"
      - "一阶极点的留数公式"
      - "m 阶极点的留数公式"
      - "留数定理"
      - "无穷远点的留数"
    pitfalls:
      - "m 阶极点公式忘乘 1/(m-1)! 或求导阶数写错"
      - "分母有重根时仍用一阶公式"
      - "围道内外奇点没数清，或把落在围道上的点也算进去"
      - "题目要求「奇点与相应留数」时只算围道内的，漏掉其余奇点"
    realworld: "本课程收益最高的题型之一；实验四把围道、极点与留数画在同一张图上。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§3.5 留数与留数定理"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
