nodes:
  - id: ch1-intro
    title: "绪论：从相量到曼德博集"
    kind: 概念
    objective: "能举出交流电路与分形图形的例子，并指认五章各自主考的题型。"
    problem: "交流电路的阻抗是一个复数，z²+c 的反复迭代画出了曼德博集——同一个 i 同时出现在工程计算与图形生成里。本课要讲清这门课为什么值得用复数，并把公开试卷上的卷面结构（填空、选择、解答各考哪一章）摆在开头。"
    practice: "以讲为主：用电路相量与分形图像两段引子开场，沿着「算复数 → 判解析 → 算积分 → 展开与留数 → 积分变换」把五章串成一张题型地图，点明卷面上 8～10 分的大题集中在哪几类，收尾说明本课程只求会算、不求证明，并交代图像画廊项目会与课程同步推进。"
    concepts:
      - "相量法"
      - "解析函数"
      - "留数"
      - "积分变换"
      - "应试主线与卷面结构"
    pitfalls:
      - "把本课程当数学分析来读，纠缠定理证明，时间花在不会考的地方"
      - "跳过绪论的路线图，后面每章都当新知识从头学"
      - "按教材章节平均分配时间，而没有按卷面分值分配"
    realworld: "交流电路的相量计算与 Python 数值计算里的复数类型；本课同时是「复变函数图像画廊」项目的起点，后面每个概念都会落成一张图。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》全书目录与主线（机械工业出版社，ISBN 978-7-111-68218-9，纸质教材）"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（含答案与逐题分值：填空 3 分乘 5、选择 3 分乘 5、解答 6～10 分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md，公式形态错位，只取题型与分值）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "国家高等教育智慧教育平台·复变函数与积分变换（课程简介逐字列出与本教材相同的五章主干）"
        type: article
        url: "https://higher.smartedu.cn/course/6a5ea0adb44e493c768f999a"
    prerequisites: []
    status: "未开始"
    mastery: 0

  - id: ch1-complex-basics
    title: "复数的运算与几何表示"
    kind: 概念
    objective: "能独立完成复数的四则、共轭、模与辐角计算，并写出全部 n 次方根。"
    problem: "公开试卷的解答题第一题稳定是「求 z 的模和辐角」，填空里还考主值、方根方程与不等式表示的区域。这些分只靠运算熟练度，本课把它们一次拿到手。"
    practice: "以讲为主：先用极坐标与三角恒等式唤醒高中内容，再把四则、共轭、模、辐角主值、三角与指数形式依次过一遍，方根的多值性用 n 个根均匀分布在圆周上这一几何事实说清，末尾练习把圆盘、环域、半平面写成复数不等式。"
    concepts:
      - "复数四则与共轭"
      - "模与辐角主值"
      - "三角形式与指数形式"
      - "乘幂与方根的多值性"
      - "平面点集与区域"
    pitfalls:
      - "辐角主值取 (-π, π]，写方根时漏掉 k 就只得到一个根"
      - "求模与辐角时只给主值不给 2kπ，卷面按参考答案要扣分"
      - "把 |z-z₀|<r 展开成实部虚部不等式时符号写错"
      - "用不等式描述区域时忘记开闭（含不含边界）"
    realworld: "并联阻抗的模与相位、方根在复平面上的均匀分布；图像画廊实验一直接画这两件事。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.1 复数及其运算、§1.2 复变函数（平面点集）"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "第 1 节、第 2 节课件转换稿（MathType 公式不可提取，仅够确认老师讲了哪些小节）"
        type: article
        url: "reference/01-复数及其运算.md"
      - title: "复变函数与积分变换 试题及答案（西安建筑科技大学精品课程站，填空 3 分乘 10；文本抽取稿 sources/xauat-complex-exam-with-answers-文本.md）"
        type: article
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变函数与积分变换试题及答案12.pdf"
    prerequisites:
      - ch1-intro
    status: "未开始"
    mastery: 0

  - id: exp1-complex-gallery
    title: "实验一：把复数画上复平面"
    kind: 实验
    objective: "做出能画出方根分布与 z²+c 迭代图的 Notebook。"
    problem: "纸上的模与辐角落到屏幕上才看得见结构：n 个方根为什么围成正多边形，z²+c 反复迭代为什么有的点逃向无穷、有的被牢牢抓住。本课验收「复数会算」能不能变成「复数会画」。"
    practice: "以练为主（验收为主）：在 Jupyter Notebook 里用 NumPy 复数数组完成方根分布图与曼德博／朱利亚缩略图，处理好复平面坐标轴、模与辐角的着色；产出的 notebook 是图像画廊的第一块，后续实验都在它上面接着长。"
    concepts:
      - "复数数组与向量化运算"
      - "复平面作图"
      - "辐角着色"
      - "迭代与逃逸判据"
    pitfalls:
      - "最常卡在复平面作图：把复数整体喂给散点图，必须显式分离实部与虚部"
      - "方根用角度制算辐角，图案整体转错角度"
      - "迭代次数取太小，逃逸边界糊成一片，看不出分形结构"
    realworld: "图像画廊项目第一阶段；相量图与分形图就是这门课在工程与图形里的样子。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.2 复数的几何表示与几何运算、§1.1 乘幂与方根"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "第 1 节课件转换稿（仅小节骨架，公式不可提取）"
        type: article
        url: "reference/01-复数及其运算.md"
    prerequisites:
      - ch1-complex-basics
    status: "未开始"
    mastery: 0

  - id: ch1-elementary
    title: "初等函数：指数、三角与对数"
    kind: 概念
    objective: "能算出 e^z、Ln z、z^a 的值并说清哪一个多值。"
    problem: "公开试卷的解答题第二题稳定考初等函数：解 sinz 与 cosz 的方程、求负数的三个方根、求 Ln 的值与连续区域，填空还问指数函数与幂函数的映照特点。这一题靠的是定义与多值性，不是技巧。"
    practice: "以讲为主：先用 e^x 的幂级数唤醒级数知识，再依次给出指数、三角、双曲、对数与幂函数的定义，把 Ln z = ln|z| + i·arg z 的多值性与主值讲透，收尾用 e^{1+i}、i^i、Ln(-1) 校验换算，并交代指数函数与幂函数的映照特点（这一问在填空里考过，也直接给图像画廊提供素材）。"
    concepts:
      - "指数函数与欧拉公式"
      - "三角函数与双曲函数"
      - "对数函数与主值分支"
      - "幂函数与多值性"
      - "初等函数的映照特点"
    pitfalls:
      - "把 Ln 当单值函数用，漏掉 2kπi"
      - "解三角方程时只给主值解，漏掉周期带来的全部根"
      - "以为 |sin z| ≤ 1（复域内不再有界）"
    realworld: "相量的指数写法与 DSP 里的复指数信号 e^{jωt}；指数函数与幂函数的映照特点也是图像画廊实验三的素材。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.3 初等函数"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "第 3 节课件转换稿（仅小节骨架：指数 / 三角 / 对数 / 幂函数）"
        type: article
        url: "reference/03-初等函数.md"
      - title: "合肥工业大学 2022 年期末试卷（解答题第二题即此类；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
    prerequisites:
      - ch1-complex-basics
    status: "未开始"
    mastery: 0

  - id: ch1-analytic
    title: "可导与解析的判定"
    kind: 实操
    objective: "能判定解析性，并由调和函数求出解析函数 f(z)。"
    problem: "两份公开试卷里都有一道 8～10 分的大题：给一个含参数的实部或虚部，先由调和条件定参数，再求出解析函数 f(z)。同一套柯西-黎曼条件在填空与选择里还负责判断哪个函数可导、哪个是调和函数——本课把它固化成可以默写的动作。"
    practice: "讲练并重：先唤醒多元微积分的偏导数与全微分，再写柯西-黎曼条件与可导的充要条件，按「拆出 u 与 v → 求四个偏导 → 验 CR → 代导数公式」练到不查书；随后接上 8～10 分的大题套路（验调和定参数 → 用 CR 求另一个分量 → 回写成 z 的函数并补常数），配套纸笔题型整理册写下判定卡与「判别解析的几种方法」清单（定义、充要条件、共轭调和函数）。"
    concepts:
      - "导数与微分"
      - "解析函数"
      - "柯西-黎曼条件"
      - "调和函数与共轭调和函数"
      - "由实部或虚部求解析函数"
    pitfalls:
      - "CR 条件成立只说明该点可导，解析还要求邻域内处处可导"
      - "由 v 求 u 时漏掉常数，或忘记用 f 在某点的取值定常数"
      - "求出的 u 与 v 没有回写成 z 的表达式，答案形式不对"
      - "极坐标形式的 CR 条件记错"
    realworld: "判断一个复场会不会保角、保能量的前提；图像画廊实验二用数值方式检验 CR 条件。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.4 复变函数的可导与解析"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "第 4 节课件转换稿（仅小节骨架：导数 / 解析函数 / 可导与解析的充要条件）"
        type: article
        url: "reference/04-复变函数的可导与解析.md"
      - title: "合肥工业大学 2022 年期末试卷（解答题含由调和函数求解析函数的 8～10 分大题；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "《复变函数与积分变换（第五版）》学习辅导与习题全解（高等教育出版社，同章节计算题参考题型）"
        type: book
        url: "https://mall.hep.com.cn/goods-30400.html"
    prerequisites:
      - ch1-complex-basics
    status: "未开始"
    mastery: 0

  - id: exp2-analytic-gallery
    title: "实验二：解析函数长什么样"
    kind: 实验
    objective: "做出解析与非解析函数的图像对照，并数值验证柯西-黎曼条件。"
    problem: "解析函数在图上有一个明显签名：模的等值线与辐角的等值线处处正交。本课验收「判定解析性」能不能从公式变成看得见的图。"
    practice: "以练为主（验收为主）：用模—辐角着色画出 e^z、sin z、Ln z 与 z̄、|z|² 的对照图，再在同一批点上数值估计偏导数、逐点检验柯西-黎曼条件，把结论写进 notebook 的结论段。"
    concepts:
      - "模—辐角着色"
      - "正交网格"
      - "数值偏导"
      - "解析性判据的数值检验"
    pitfalls:
      - "最常卡在有限差分：步长取太大，CR 检验在奇点附近假失败"
      - "Ln z 的分支切割线画成一条硬边，被误判为不解析"
      - "把某点 CR 成立直接写成解析"
    realworld: "图像画廊项目第二阶段；工程上判断复场是否保角、保能量，用的就是这套检验。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.4 可导与解析、§1.3 初等函数"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
    prerequisites:
      - ch1-analytic
      - exp1-complex-gallery
    status: "未开始"
    mastery: 0

  - id: exp3-mapping-grid
    title: "实验三：保角映射的网格实验"
    kind: 实验
    objective: "做出 z²、e^z、1/z 的网格变形图，指出直角是否被保持。"
    problem: "把一张方格纸按 w=z² 与 w=e^z 变形，格子会弯、会拉伸，交角却仍是直角——除非落在 f′(z)=0 的点上。本课验收「解析」与「保角」之间那条等号。"
    practice: "以练为主（验收为主）：在复平面上铺参数网格，逐点映射后画出变形网格与局部放大图，重点看原点（z² 的临界点）与 1/z 的极点附近角度怎样坏掉，图上标出结论：保角成立的条件是导数非零。"
    concepts:
      - "映射的像"
      - "网格变形"
      - "保角性与导数非零"
      - "临界点"
    pitfalls:
      - "最常卡在只看整体网格，错过导数零点附近的角度被压缩"
      - "映射 z² 时把多值逆的不同分支混在一起画"
      - "以为保角对任意函数成立（如 z̄ 处处不保角）"
    realworld: "图像画廊项目第三阶段；电磁场与流体里的等势线、流线，就是把规则网格映成曲线网格。本课只做可视化，不展开共形映射理论（本教材没有该章）。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§1.4 导数的几何意义（伸缩率与旋转角）、§1.3 指数函数与幂函数的映照特点"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
    prerequisites:
      - ch1-elementary
      - ch1-analytic
      - exp2-analytic-gallery
    status: "未开始"
    mastery: 0

  - id: ch2-integral-direct
    title: "复积分的概念与直接计算"
    kind: 概念
    objective: "能用参数化法直接算出一段曲线上的复积分。"
    problem: "公开试卷的解答题第三题稳定是 6～7 分：沿一段直线、折线或参数曲线求积分。被积函数解析时还可以用原函数代端点，本课把这两条路分清楚。"
    practice: "以讲为主：先唤醒多元微积分的曲线参数化与定积分，再把复积分的定义、基本性质与参数化计算法（把 z 写成 z(t)、dz 换成 z′(t)dt）走一遍，对比「用原函数代端点」与「只能参数化硬算」两类例题，收尾交代估值不等式。"
    concepts:
      - "复积分定义"
      - "参数化计算法"
      - "原函数与积分与路径无关"
      - "估值不等式"
    pitfalls:
      - "dz 忘记换成 z′(t)dt，直接把 z(t) 代进去就积"
      - "被积函数含 z̄ 时当解析函数处理，套错结论"
      - "折线分段时漏掉其中一段，或端点代错方向"
      - "闭合路径方向写反（逆时针为正）"
    realworld: "把积分看成沿路径累加的位移；图像画廊实验四里的围道就是这个 C。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§2.1 复变函数积分的概念"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（解答题第三题即沿折线或参数曲线的积分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "复变积分 B 集习题（按 B1～B6 与节次分组的题源；文本抽取稿 sources/xauat-exercises-B-文本.md）"
        type: book
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变积分B集习题.pdf"
    prerequisites:
      - ch1-complex-basics
    status: "未开始"
    mastery: 0

  - id: ch2-cauchy-formula
    title: "柯西积分公式与高阶导数"
    kind: 实操
    objective: "能用柯西积分公式与高阶导数公式算出闭路积分。"
    problem: "分母只要出现 (z-z₀)ⁿ，题目就变成「把 z₀ 代进去、求几阶导、除以阶乘、乘上 2πi」。这是公开试卷里 7～10 分的大题，也是全卷最容易靠熟练度拿满的地方。"
    practice: "讲练并重：先回头确认解析性判定，再写柯西积分公式与高阶导数公式，按「找奇点 → 看它在不在围道内 → 凑成标准形式 → 套公式」过一遍各类分子（多项式、指数、三角），配套纸笔题型整理册写下「分母幂次决定用哪个公式」的对照卡，并标出与留数定理的分工。"
    concepts:
      - "柯西积分公式"
      - "高阶导数公式"
      - "标准形式配凑"
      - "奇点在围道内外的判定"
    pitfalls:
      - "z₀ 在围道外时公式不适用，答案应是 0"
      - "高阶导数公式里的 1/n! 与 2πi 位置写反"
      - "分子里还留着 (z-z₀) 的因子，没有先约掉就套公式"
      - "围道内有两个奇点时只算一个"
    realworld: "考试里最高频的一道大题；也是图像画廊实验四要画的「围道把奇点圈住」那件事。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§2.2 柯西积分公式"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
