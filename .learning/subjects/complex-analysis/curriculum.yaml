  - id: exp4-residue-contour
    title: "实验四：围道上的留数"
    kind: 实验
    objective: "做出围道—极点—留数三者对照的可视化，并核验留数定理。"
    problem: "留数定理说闭路积分等于 2πi 乘圈内留数之和。把极点画出来、把围道画出来、把数值积分算出来，三者在同一张图上对得上，这条定理才算真的拿到手。"
    practice: "以练为主（验收为主）：把前三个实验的图并进同一份画廊 notebook，再叠上极点与围道这一层；为若干被积函数画极点分布与可选围道，用沿圆周采样的数值围道积分与 2πi 乘留数之和对照，并故意换一条把奇点漏在外面的围道看结果怎样变，结论写进 notebook 结论段。"
    concepts:
      - "围道的选取"
      - "极点分布图"
      - "数值围道积分"
      - "留数定理的数值核验"
    pitfalls:
      - "最常卡在采样点数：沿围道采样太稀，光滑函数也积不准"
      - "极点落在围道附近，数值结果漂移却以为公式错了"
      - "把 2πi 与 1/(2πi) 用反（后面做正逆变换会踩同一个坑）"
    realworld: "图像画廊项目第四阶段，也是整门课「算得对」的最终检验。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§3.5 留数与留数定理、§2.3 复合闭路"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
    prerequisites:
      - ch3-residue
      - ch2-cauchy-theorem
      - exp3-mapping-grid
    status: "未开始"
    mastery: 0

  - id: ch4-fourier-series
    title: "傅里叶级数与正交展开"
    kind: 概念
    objective: "能把周期函数展开成傅里叶级数并写出系数。"
    problem: "方波能被一串正弦波叠加出来——为什么可行、系数怎么求，是傅里叶变换那一章的地基。据公开试卷，这一节基本只出填空级小题，本课求看懂频谱与系数公式，不为它多花时间。"
    practice: "以讲为主：先用三角函数系的正交性与定积分唤醒级数知识，再讲周期函数的三角形式与复指数形式傅里叶级数、系数公式与狄利克雷收敛条件，并以方波为例把系数计算完整走一遍；末尾点明「级数到变换」这一步是怎么跨过去的。"
    concepts:
      - "三角函数系的正交性"
      - "傅里叶级数（三角形式）"
      - "复指数形式"
      - "狄利克雷条件"
      - "频谱"
    pitfalls:
      - "周期取错，2π 与 2l 两套系数公式混用"
      - "奇偶函数没利用对称性，白算一半积分"
      - "间断点处写成 f(x)，而应是左右极限的平均"
    realworld: "频谱概念的来源；电信后续课程里所有的「频域」都从这里开始。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§4.1 积分变换的预备知识、§4.2 傅里叶级数"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "拉普拉斯变换与傅里叶变换（南京大学数字信号处理课程讲义，变换对与性质的整理方式；文本抽取稿 sources/nju-dsp-laplace-fourier-文本.md）"
        type: article
        url: "http://www.lamda.nju.edu.cn/yehj/dsp2020/9.pdf"
    prerequisites:
      - ch1-elementary
    status: "未开始"
    mastery: 0

  - id: ch4-fourier-transform
    title: "傅里叶变换：定义与性质"
    kind: 实操
    objective: "能查附录 B 用性质算出常用函数的傅里叶变换与逆变换。"
    problem: "矩形脉冲变成 sinc、δ 函数的变换是 1、求导变成乘 iω。公开试卷里傅里叶变换稳定出现在填空与选择（求某个函数的变换、求常值函数的逆变换、判断谁不存在变换），靠的就是「查表加性质」两步。"
    practice: "讲练并重：先唤醒反常积分与「线性运算可叠加」的直觉，再给出傅里叶变换的定义与存在条件，随后把线性、位移、微分、积分、卷积、对称性逐条配上典型例题，练「先查表再套性质、少动积分」的写法；用定义直接验证一组变换对（δ 函数那一类，卷面上出现过这种 5 分小题），并配套「复变计算工具」用 FFT 数值对照自己算出的变换对。"
    concepts:
      - "傅里叶变换的定义"
      - "存在条件"
      - "附录 B 常用变换表"
      - "位移与微分性质"
      - "卷积定理"
      - "δ 函数与变换对"
    pitfalls:
      - "1/√(2π) 与 1/(2π) 两套约定混用（以本教材附录 B 为准）"
      - "位移性质里指数因子的符号写反"
      - "δ 函数的变换与常数函数的变换张冠李戴"
      - "问「哪个函数不存在傅里叶变换」时忘记绝对可积这个前提"
    realworld: "DSP 的核心工具；附录 B 就是这门课发给你的变换对速查表。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§4.3 傅里叶变换的概念、§4.4 傅里叶变换的性质、§4.5 应用（轻带）、附录 B 常用积分变换表（纸质书第 129 页起）"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（填空与选择考傅里叶变换与逆变换、δ 函数，每题 3 分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "傅里叶变换的计算（南京大学数字信号处理课件，偏「怎么算」而不是「为什么」；文本抽取稿 sources/nju-dsp-fourier-laplace-slides-文本.md）"
        type: article
        url: "http://www.lamda.nju.edu.cn/wangw/dsp2022/slides/09.pdf"
    prerequisites:
      - ch4-fourier-series
    status: "未开始"
    mastery: 0

  - id: ch5-laplace-concept
    title: "拉普拉斯变换：定义与查表"
    kind: 概念
    objective: "能查表写出常用函数的拉普拉斯变换并说明收敛域。"
    problem: "傅里叶变换要求函数绝对可积，e^{at} 就不合格；乘上一个衰减因子 e^{-σt} 之后，绝大多数工程函数都能变换。公开试卷的填空直接考定义式与常用变换对，本课先把这两样记牢。"
    practice: "以讲为主：先唤醒反常积分与含参量积分的收敛判断，再从傅里叶变换的局限引出拉普拉斯变换的定义与存在定理，用定义直算常数、指数、正弦与幂函数，随后转成查附录 B 的动作，并交代收敛域（σ 的下界）怎么写。"
    concepts:
      - "拉普拉斯变换的定义"
      - "存在定理与收敛域"
      - "常用变换对"
      - "查表法"
    pitfalls:
      - "收敛域写成 s>0，而实际是 s>a"
      - "单位阶跃与 δ 函数的变换记混"
      - "把 t 域与 s 域的性质搬错（拉氏变换里乘法没有简单对应）"
    realworld: "电路瞬态分析与控制系统的传递函数——本课程里最贴电信专业的一章。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§5.1 拉普拉斯变换的概念、附录 B 常用积分变换表"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "复变函数与积分变换 试题及答案（西安建筑科技大学精品课程站，填空考拉氏积分定义式；文本抽取稿 sources/xauat-complex-exam-with-answers-文本.md）"
        type: article
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变函数与积分变换试题及答案12.pdf"
      - title: "拉普拉斯变换与傅里叶变换（南京大学数字信号处理课程讲义，把两者放在一起对比、整理变换对与性质；文本抽取稿 sources/nju-dsp-laplace-fourier-文本.md）"
        type: article
        url: "http://www.lamda.nju.edu.cn/yehj/dsp2020/9.pdf"
    prerequisites:
      - ch4-fourier-transform
    status: "未开始"
    mastery: 0

  - id: ch5-laplace-properties
    title: "拉氏变换的性质与计算"
    kind: 实操
    objective: "能用微分、位移、卷积性质算出正变换。"
    problem: "考试几乎不会让你用定义积出来：看到 t·e^{at}、看到 f′(t)、看到分段函数，对应的是哪条性质，才是拿分点。最后那道大题的第一步就是「把微分方程变换过去」，靠的全是这条性质。"
    practice: "讲练并重：按线性、微分、积分、位移、延迟、相似、卷积逐条讲并即时练，重点是「把题面凑成表里的标准形式」；配套纸笔题型整理册，把性质与常用变换对合成一张速查卡。"
    concepts:
      - "线性性质"
      - "微分与积分性质"
      - "位移与延迟性质"
      - "卷积定理"
      - "标准形式配凑"
    pitfalls:
      - "延迟性质的 e^{-sτ} 与位移性质的 F(s-a) 张冠李戴"
      - "微分性质里漏掉初值 f(0)，这一步写错后面全错"
      - "分段函数直接查表，没有先用阶跃函数拼成整体"
    realworld: "传递函数运算与系统串联的卷积；也是逆变换那一课的准备。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§5.2 拉普拉斯变换的性质、附录 B"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（解答题最后第二题用拉氏变换解初值问题，9 分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
    prerequisites:
      - ch5-laplace-concept
    status: "未开始"
    mastery: 0

  - id: ch5-laplace-inverse-apply
    title: "逆变换：部分分式与查表"
    kind: 实操
    objective: "能用部分分式与查表求出逆变换并解微分方程。"
    problem: "两份公开试卷都有一道 9～10 分大题：用拉普拉斯变换解微分方程初值问题（西建大那份还是方程组）。通道固定——变换过去、解出像函数、部分分式拆开、倒查表回来；拆得对不对、拆到几项，决定卷面能不能收尾。"
    practice: "以练为主：先唤醒线性代数里解待定系数方程组、以及常微分方程的特征方程，再按「分母因式分解 → 部分分式（含重根与不可约二次因式）→ 倒查表 → 用初值定常数」练到能独立收尾，末尾把初值问题的完整流程走通（含两个方程联立的题型）。"
    concepts:
      - "拉普拉斯逆变换"
      - "部分分式分解"
      - "重根与二次因式"
      - "用变换解微分方程与方程组"
    pitfalls:
      - "重根项少写一层 A/(s-a)²"
      - "部分分式系数解错却继续往下算，整题报废"
      - "倒查表时忘了乘 e^{at} 或符号写反"
      - "解出像函数就交卷，没有逆变换回 t 域"
    realworld: "电路瞬态响应与控制系统输出；考试里性价比最高的一道大题。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§5.3 拉普拉斯逆变换、§5.4 拉普拉斯变换的应用、附录 B"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（解答题用拉氏变换解初值问题，9 分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "复变函数与积分变换 试题及答案（西安建筑科技大学精品课程站，第七大题为用拉氏变换解方程组，10 分；文本抽取稿 sources/xauat-complex-exam-with-answers-文本.md）"
        type: article
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变函数与积分变换试题及答案12.pdf"
      - title: "复变积分 B 集习题（覆盖到积分变换部分的分章题组；文本抽取稿 sources/xauat-exercises-B-文本.md）"
        type: book
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变积分B集习题.pdf"
    prerequisites:
      - ch5-laplace-properties
    status: "未开始"
    mastery: 0

  - id: final-mock-exam
    title: "期末模拟卷与答题顺序"
    kind: 实操
    objective: "能在一份限时模拟卷上按题型顺序独立做完，含概念简答。"
    problem: "会算不等于考得完：先做哪道、卡住多久就跳，直接决定分数。公开试卷还固定留一道概念简答（3～10 分，如「判别解析的方法有哪几种」「sinz 与 sinx 的性质异同」「复积分有哪些计算方法」），这类题不写就白丢分。本课用一份混合卷把五章主线串起来实战一次。"
    practice: "以练为主：按公开试卷的卷面结构（填空、选择、解答）从三套试卷与 B 集习题里拼一份覆盖判解析性、由调和函数求解析函数、复积分、洛朗展开、留数与极点阶、拉氏变换解微分方程的卷子，限时独立做完；做题前先把纸笔题型整理册里的判定卡、选型卡、速查卡翻一遍，做完按「错题归到哪一章、是识别错还是算错」归因，并专门补上概念简答那一道的答题要点。"
    concepts:
      - "题型识别"
      - "时间分配与答题顺序"
      - "错题归因"
      - "概念性简答的答题要点"
    pitfalls:
      - "在留数大题上耗太久，后面的变换小题没时间做"
      - "把「不会做」与「算错」混成一类，复习方向就错了"
      - "概念简答空着不写，直接丢掉 3～10 分"
      - "只看答案不动笔，限时卷变成阅读卷"
    realworld: "直接对标期末；这份卷子的错题清单就是最后一周的复习计划。"
    resources:
      - title: "合肥工业大学 2022 年期末试卷（含答案与逐题分值，可作卷面结构模板；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "复变函数与积分变换 试题及答案（西安建筑科技大学精品课程站，两份带答案的整卷；文本抽取稿 sources/xauat-complex-exam-with-answers-文本.md 与 sources/xauat-complex-exam-with-answers-13-文本.md）"
        type: article
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变函数与积分变换试题及答案12.pdf"
      - title: "复变积分 B 集习题（分章题组，可拼混合练习；文本抽取稿 sources/xauat-exercises-B-文本.md）"
        type: book
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变积分B集习题.pdf"
      - title: "李君、于非非《复变函数与积分变换》各章习题（纸质教材）"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
    prerequisites:
      - ch1-analytic
      - ch2-cauchy-theorem
      - ch3-residue
      - ch4-fourier-transform
      - ch5-laplace-inverse-apply
    status: "未开始"
    mastery: 0

edges:
  - from: ch1-intro
    to: ch1-complex-basics
    reason: "绪论给出全书主线与卷面结构，复数运算是第一个可算的对象"
  - from: ch1-complex-basics
    to: exp1-complex-gallery
    reason: "实验一验收复数的模、辐角与方根：画得出来才算会算"
  - from: ch1-complex-basics
    to: ch1-elementary
    reason: "初等函数的定义建立在复数运算与指数形式之上"
  - from: ch1-complex-basics
    to: ch1-analytic
    reason: "柯西-黎曼条件要拆实部虚部并求偏导，先得会算复数的实部与虚部"
  - from: ch1-analytic
    to: exp2-analytic-gallery
    reason: "实验二验收解析性判定，并把柯西-黎曼条件转成数值检验"
  - from: exp1-complex-gallery
    to: exp2-analytic-gallery
    reason: "复用实验一的复平面作图与着色代码，缩短第二次的项目启动成本"
  - from: ch1-elementary
    to: exp3-mapping-grid
    reason: "保角网格实验要画 e^z 与幂函数的像，先得会算初等函数"
  - from: ch1-analytic
    to: exp3-mapping-grid
    reason: "保角性来自导数非零，判据与导数计算都出自本课"
  - from: exp2-analytic-gallery
    to: exp3-mapping-grid
    reason: "实验三在实验二的着色与网格工具上继续做映射变形图"
  - from: ch1-complex-basics
    to: ch2-integral-direct
    reason: "复积分的参数化计算要用复数的指数形式与曲线方程"
  - from: ch2-integral-direct
    to: ch2-cauchy-formula
    reason: "先会按定义算积分，才知道公式省下了哪一步"
  - from: ch1-analytic
    to: ch2-cauchy-formula
    reason: "公式的条件是被积函数在区域内解析，解析性判定是前置"
  - from: ch2-integral-direct
    to: ch2-cauchy-theorem
    reason: "定理断言的是这类积分为零，先要有积分概念与算例"
  - from: ch1-analytic
    to: ch2-cauchy-theorem
    reason: "定理要求区域内的点处处解析"
  - from: ch2-cauchy-formula
    to: ch2-cauchy-theorem
    reason: "先会用公式处理有奇点的题，再看「挖洞」与推广怎样解释它（本教材把公式排在定理推广之前）"
  - from: ch1-complex-basics
    to: ch3-power-series
    reason: "复数项级数的收敛要借助复数的模来定义"
  - from: ch3-power-series
    to: ch3-taylor-laurent
    reason: "展开出的级数首先要在指定环域收敛，收敛半径是前提"
  - from: ch2-cauchy-formula
    to: ch3-taylor-laurent
    reason: "泰勒系数来自高阶导数公式，展开的合法性也由解析性保证"
  - from: ch3-taylor-laurent
    to: ch3-zeros-poles
    reason: "奇点分类按洛朗展开的负幂项判定"
  - from: ch3-zeros-poles
    to: ch3-residue
    reason: "留数规则按极点的阶选用，类型判错则整题算错"
  - from: ch3-residue
    to: exp4-residue-contour
    reason: "实验四验收留数定理，用数值围道积分核对留数之和"
  - from: ch2-cauchy-theorem
    to: exp4-residue-contour
    reason: "围道选取与复合闭路的做法来自本课"
  - from: exp3-mapping-grid
    to: exp4-residue-contour
    reason: "把前三阶段的图并进同一份画廊 notebook，再叠上极点与围道这一层"
  - from: ch1-elementary
    to: ch4-fourier-series
    reason: "复指数形式的傅里叶级数要用欧拉公式与 e^{iθ}"
  - from: ch4-fourier-series
    to: ch4-fourier-transform
    reason: "变换是周期趋于无穷时级数的极限，先由级数与频谱过渡"
  - from: ch4-fourier-transform
    to: ch5-laplace-concept
    reason: "拉普拉斯变换是给傅里叶变换乘上衰减因子后的推广"
  - from: ch5-laplace-concept
    to: ch5-laplace-properties
    reason: "性质的每一条都要与定义和常用变换对对照着记"
  - from: ch5-laplace-properties
    to: ch5-laplace-inverse-apply
    reason: "逆变换靠性质与查表倒推，先把正变换的性质练熟"
  - from: ch1-analytic
    to: final-mock-exam
    reason: "模拟卷里判定解析性与由调和函数求解析函数是必考大题"
  - from: ch2-cauchy-theorem
    to: final-mock-exam
    reason: "模拟卷的复积分大题按三条路的选型出题"
  - from: ch3-residue
    to: final-mock-exam
    reason: "留数题是卷面分值最高的部分"
  - from: ch4-fourier-transform
    to: final-mock-exam
    reason: "填空与选择里的变换题要求查表加性质的熟练度"
  - from: ch5-laplace-inverse-apply
    to: final-mock-exam
    reason: "用拉氏变换解微分方程是卷面最后一道大题"
