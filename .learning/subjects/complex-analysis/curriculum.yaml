  - id: ch3-zeros-poles
    title: "奇点分类：零点与极点"
    kind: 概念
    objective: "能判定奇点类型与极点的阶，并写出零点阶。"
    problem: "留数能不能用现成规则算，全看奇点是可去的、m 阶极点还是本性奇点。公开试卷的填空与选择都直接考「谁是几阶极点」，大题的第一步也永远是找奇点定阶。"
    practice: "以讲为主：从函数的零点及其阶讲起，再按洛朗展开的负幂项把孤立奇点分成可去奇点、极点与本 性奇点三类，给出极点阶的判定办法（看分母零点的阶、用极限判别），末尾交代无穷远点的奇点与「有限复平面内的奇点」这个问法。"
    concepts:
      - "零点及其阶"
      - "孤立奇点的分类"
      - "极点的阶"
      - "无穷远点的奇点"
    pitfalls:
      - "分子分母零点相互抵消后阶数变了（如 sin z / z³）"
      - "把本性奇点当极点套留数规则"
      - "只写有限复平面的奇点却漏了原点，或反过来把无穷远点也算进去"
    realworld: "控制系统里极点的位置决定稳定性——这门课的极点就是这个极点。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§3.4 零点与极点"
