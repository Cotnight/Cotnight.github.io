  - id: ch2-cauchy-theorem
    title: "柯西积分定理及其推广"
    kind: 实操
    objective: "能判断积分是否为零，并用复合闭路处理有奇点的题。"
    problem: "解析区域内的闭路积分一律为零，可奇点偏偏躲在围道里——「挖洞」（复合闭路）就是把这条例外搬回正轨的办法。西建大的填空还考 Ln z 的连续区域，问的正是「哪里可以让定理成立」。"
    practice: "讲练并重：先唤醒多元微积分里「区域有没有洞」的直觉，再讲柯西积分定理、复合闭路定理、原函数与不定积分，按「围道内有没有奇点 → 有就挖洞把小围道替换大围道 → 换成标准形式」练；配套纸笔题型整理册把本章的三条路（参数化、柯西定理、柯西公式与高阶导数）做成一张选型卡。"
    concepts:
      - "柯西积分定理"
      - "单连通与复连通区域"
      - "复合闭路定理"
      - "原函数与不定积分"
    pitfalls:
      - "把定理用在不解析的地方（如 1/z 沿含原点的围道）"
      - "挖洞时漏掉内圈方向与大圈相反"
      - "把「积分为零」与「被积函数恒为零」混为一谈"
    realworld: "电路里的守恒量与无旋场的闭合回路积分；三条路的选型就是考试里最快拿分的地方。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§2.3 柯西积分定理及其推广"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "复变积分 B 集习题（积分部分按节分组的题源；文本抽取稿 sources/xauat-exercises-B-文本.md）"
        type: book
        url: "https://netedu.xauat.edu.cn/jpkc/netclass/jpkc/fbhs/dir/other/复变积分B集习题.pdf"
      - title: "《复变函数与积分变换（第五版）》学习辅导与习题全解（同章节计算题参考题型）"
        type: book
        url: "https://mall.hep.com.cn/goods-30400.html"
    prerequisites:
      - ch2-integral-direct
      - ch1-analytic
      - ch2-cauchy-formula
    status: "未开始"
    mastery: 0

  - id: ch3-power-series
    title: "幂级数与收敛半径"
    kind: 概念
    objective: "能求出幂级数的收敛半径并判定复数项级数收敛。"
    problem: "同一个幂级数在圆内收敛、圆外发散，圆上还要单独查。收敛半径在公开试卷里是填空与选择级的小题（每处 3 分），判据只有比值法与根值法两条，本课只求稳、不铺开。"
    practice: "以讲为主：先唤醒高等数学里数项级数的收敛判别与比值法，再讲复数项级数的收敛（实部虚部同时收敛）、阿贝尔定理、收敛半径的比值与根值求法，以及幂级数在收敛圆内的分析性质；练的重点是把系数与圆心看准，能一口气写出半径。"
    concepts:
      - "复数项级数的收敛"
      - "阿贝尔定理"
      - "收敛半径"
      - "幂级数的分析性质"
    pitfalls:
      - "比值法算出的是相邻系数之比，别把 R 写反"
      - "默认收敛圆上的点也收敛"
      - "把 ∑aₙzⁿ 与 ∑aₙ(z-z₀)ⁿ 的展开中心搞混"
    realworld: "DSP 里滤波器的传递函数就是 z 的幂级数，收敛域对应系统的稳定范围。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§3.1 复数项级数、§3.2 幂级数"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（收敛半径出现在填空与选择，每题 3 分；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
    prerequisites:
      - ch1-complex-basics
    status: "未开始"
    mastery: 0

  - id: ch3-taylor-laurent
    title: "泰勒级数与洛朗级数"
    kind: 实操
    objective: "能把函数在指定区域展开成泰勒级数或洛朗级数。"
    problem: "同一个 f(z)=1/((z-1)(z-2))，在 |z|<1、1<|z|<2、|z|>2 三个环域里展开出的级数完全不同。洛朗展开在公开试卷里稳定是一道 10 分大题，考法固定：先定环域，再选中心，再套几何级数。"
    practice: "讲练并重：先唤醒实函数的泰勒展开与几何级数求和 1/(1-x)=∑xⁿ，再讲泰勒级数的系数来源（高阶导数公式）、洛朗级数的环形域与负幂项，按「定环域 → 部分分式拆开 → 凑成 1/(1±w) 的形式 → 写出成立范围」练；配套源码加测试的「复变计算工具」，把每道展开题的系数写成断言，与现成库的展开结果对照。"
    concepts:
      - "泰勒级数"
      - "洛朗级数"
      - "环形域"
      - "间接展开法"
      - "负幂项"
    pitfalls:
      - "洛朗展开只写正幂项就交卷，负幂部分是得分点"
      - "凑 1/(1-w) 时忘写 |w|<1 这个成立范围"
      - "把展开中心选在奇点上"
      - "两个环域的展开式抄串（一个用 z 的正幂，一个用 z 的负幂）"
    realworld: "DSP 里把传递函数展开成 z 的级数看系统响应；图像画廊实验四用洛朗的 c₋₁ 解释留数。"
    resources:
      - title: "李君、于非非《复变函数与积分变换》§3.3 泰勒级数与洛朗级数"
        type: book
        url: "http://cs.cmpedu.com/books/book/5604703.htm"
      - title: "合肥工业大学 2022 年期末试卷（解答题含圆环域洛朗展开的 10 分大题；文本抽取稿 sources/hfut-complex-exam-with-answers-文本.md）"
        type: article
        url: "http://faculty.hfut.edu.cn/_resources/group1/M00/00/1C/rB_zR2ks_QyAOcheAAP1H6_9avI556.pdf"
      - title: "复变函数与积分变换 试题及答案（西安建筑科技大学精品课程站，第五大题为圆环内罗朗展式；文本抽取稿 sources/xauat-complex-exam-with-answers-文本.md）"
