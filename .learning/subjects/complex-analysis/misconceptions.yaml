misconceptions:
  - topic: 复平面与二元函数的类比
    question: 能不能把复平面类比于一个二元函数的图像（比如 z = x + y），然后它的积分微分思路也类比？
    misunderstanding: 想把复变函数当成二元函数的「曲面」来想象（并用 z = x + y 这种实值表达式当例子）。实际复变函数的图像需要四维，无法画成曲面；且 z = x + y 是实值函数（v 恒为 0），CR 条件立刻不成立，处处不可导，不能代表复变函数。
    answer_summary: 复平面当 R² 用没问题（点集等价），复变函数要当「平面到平面的映射」而不是曲面；复积分是两条实曲线积分，柯西定理就是格林公式加 CR 条件；但复可导比实可微多一个 CR 条件（雅可比须是旋转伸缩），解析性与多值性在实多元里没有对应物。
    follow_up: 用 f(z)=z（u=x, v=y）与 f(z)=x+y（u=x+y, v=0）对照算一次四个偏导与 CR，亲手验证前者处处解析、后者处处不解析；再看 0005 与 0009 两节课件里的 CR 条件与格林公式推导。
    importance: medium
